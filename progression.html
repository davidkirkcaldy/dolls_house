<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Build Progression</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f3e9;
            margin: 0;
            padding: 0;
        }
        header {
            background: #b3c6e7;
            padding: 2rem 0;
            text-align: center;
        }
        header h1 {
            font-size: 2.2rem;
            color: #2d3a4b;
        }
        section {
            margin: 2rem auto;
            max-width: 900px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 2rem;
        }
        h2 {
            color: #3b5998;
            margin-bottom: 1rem;
        }
        .progress-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .progress-gallery img {
            width: 200px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .caption {
            text-align: center;
            font-size: 1rem;
            color: #555;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>House Build Progression</h1>
    </header>
    <section>
        <h2>Stages of the Build</h2>
        <div class="progress-gallery">
            <div>
                <img src="resources/images/build/parts_delivered.jpeg" alt="Foundation">
                <div class="caption">Parts supplied</div>
            </div>
            <div>
                <img src="resources/images/build/dry_build.jpeg" alt="Foundation">
                <div class="caption">Dry Build</div>
            </div>
            <div>
                <img src="resources/images/build/walls_floors_ceilings.jpeg" alt="Walls">
                <div class="caption">Walls, Floors, and Ceilings Added</div>
            </div>
            <div>
                <img src="resources/images/build/roof_chimneys_added.jpeg" alt="Roof">
                <div class="caption">Roof and ChimneysAdded</div>
            </div>
            <div>
                <img src="resources/images/build/lighting_system_added.jpeg" alt="Interior">
                <div class="caption">Interior Lighting Installed</div>
            </div>
            <div>
                <img src="resources/images/build/front_added.jpeg" alt="Completed House">
                <div class="caption">Front Added</div>
            </div>
        </div>
    </section>
</body>
<footer style="text-align:center; padding:1rem 0; color:#2d3a4b; background:#f7f3e9; font-size:0.95rem;">
    &copy; 2025 David Kirkcaldy. All rights reserved.
</footer>
</html>
